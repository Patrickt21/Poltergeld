org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AGP 8.5 predates SDK 35; compileSdk 35 works but needs this opt-in.
android.suppressUnsupportedCompileSdk=35
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# NOTE for ARM64 build hosts (Raspberry Pi / aarch64): AGP downloads an x86_64
# aapt2 from Maven that cannot run here. Point Gradle at a native ARM64 aapt2,
# e.g. by building with:
#   ./gradlew :app:assembleDebug -Pandroid.aapt2FromMavenOverride=/path/to/aapt2
# (Do not hard-code this in the committed file — it would break x86 CI.)
