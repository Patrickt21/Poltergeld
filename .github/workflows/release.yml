name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing keystore from secrets
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}"
            echo "keyAlias=ghostfolio-widget"
            echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}"
          } > keystore.properties

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Name APK after tag
        run: cp app/build/outputs/apk/release/app-release.apk "Poltergeld-${{ github.ref_name }}.apk"

      - name: Create GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: Poltergeld-${{ github.ref_name }}.apk
          generate_release_notes: true
